version: '3.8'

services:
  mongo:
    image: mongo:7
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  app1:
    build: .
    environment:
      - MONGO_URL=mongodb://mongo:27017
      - MONGO_DB=urlshortener
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - BASE_URL=http://localhost:80
      - INSTANCE_ID=instance-1
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

  app2:
    build: .
    environment:
      - MONGO_URL=mongodb://mongo:27017
      - MONGO_DB=urlshortener
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - BASE_URL=http://localhost:80
      - INSTANCE_ID=instance-2
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

  app3:
    build: .
    environment:
      - MONGO_URL=mongodb://mongo:27017
      - MONGO_DB=urlshortener
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - BASE_URL=http://localhost:80
      - INSTANCE_ID=instance-3
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app1
      - app2
      - app3

volumes:
  mongo_data: